<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP — Dimple & Jomer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rsvp.css">
</head>
<body>

<div class="decor" id="decor"></div>

<div class="wrap">
  <div class="crest">
    <div class="monogram">D&nbsp;&amp;&nbsp;J</div>
    <div class="eyebrow">We Joyfully Invite You</div>
    <h1>Reply to Our Invitation</h1>
    <div class="sub">Dimple &amp; Jomer · 15th December 2026</div>
  </div>

  <form class="card" id="rsvpForm" novalidate>

    <div class="field">
      <label for="fullName">Full Name <span class="required">*</span></label>
      <input type="text" id="fullName" name="fullName" placeholder="e.g. Maria Santos" required>
    </div>

    <div class="row2">
      <div class="field">
        <label for="numGuests">Number of Guest(s) <span class="required">*</span></label>
        <select id="numGuests" name="numGuests" required>
          <option value="" disabled selected>Select</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="field">
        <label for="attending">Are you attending? <span class="required">*</span></label>
        <select id="attending" name="attending" required>
          <option value="" disabled selected>Select</option>
          <option value="Yes, I'll be there.">Yes, I'll be there.</option>
          <option value="No, I can't make it.">No, I can't make it.</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@email.com">
      </div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="09XX XXX XXXX">
      </div>
    </div>

    <div class="field">
      <label for="diet">Dietary Restrictions<span class="required">*</span></label>
      <input type="text" id="diet" name="diet" placeholder="e.g. Vegetarian, none, allergies" required>
    </div>

    <div class="divider">a note for the couple</div>

    <div class="field">
      <label for="message">Message for the Couple</label>
      <textarea id="message" name="message" placeholder="Share your well-wishes for Dimple & Jomer..."></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Send My RSVP</button>
    <div class="status-msg" id="statusMsg"></div>
  </form>

  <div class="footer-note">Kindly reply on or before November 15, 2026</div>
</div>

<!-- success modal -->
<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div class="icon">✦</div>
    <h3>Thank You!</h3>
    <p>Your RSVP has been received with love. We can't wait to celebrate this day with you.</p>
    <button id="closeSuccess">Close</button>
  </div>
</div>
</body>
    <script src="rsvp.js"></script>
</html>
